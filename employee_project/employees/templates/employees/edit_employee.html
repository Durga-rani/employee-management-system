<!DOCTYPE html>
<html>
<head>
    <title>Edit Employee</title>
</head>
<body>

<h1>Edit Employee</h1>

<form method="POST">
    {% csrf_token %}

    <label>Name:</label>
    <input type="text" name="name" value="{{ employee.name }}"><br><br>

    <label>Email:</label>
    <input type="email" name="email" value="{{ employee.email }}"><br><br>

    <label>Phone:</label>
    <input type="text" name="phone" value="{{ employee.phone }}"><br><br>

    <label>Department:</label>
    <input type="text" name="department" value="{{ employee.department }}"><br><br>

    <label>Salary:</label>
    <input type="number" step="0.01" name="salary" value="{{ employee.salary }}"><br><br>

    <button type="submit">Update Employee</button>
</form>

<br>

<a href="{% url 'employee_list' %}">Back to Employee List</a>

</body>
</html>
